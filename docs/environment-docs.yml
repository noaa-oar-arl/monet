name: monet-docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - ipykernel
  - ipython
  #
  # core
  - cartopy
  - dask
  - matplotlib
  - netcdf4
  - numpy
  - pandas>=1.0
  - pillow>=9.1.0
  - seaborn
  - xarray
  - cmake>=3.21
  - kokkos>=5.1
  - kokkos-kernels>=5.1
  - openmpi
  - fortran-compiler
  #
  #
  - pip>=21.1
  - pip:
      - mkdocs
      - mkdocs-material
      - mkdocstrings[python]
      - mkdocs-gallery
      - "-e ../"
