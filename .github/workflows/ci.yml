name: CI

on:
  push:
    branches: [stable, master, develop]
  pull_request:
    branches: [stable, master, develop, 'feature/**']

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Removed the strict repository check to allow testing on your fork
    strategy:
      fail-fast: false
      matrix:
        # Modernized Python versions (3.6 removed)
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        shell: bash -l {0} # Necessary for micromamba to activate environments

    steps:
      - uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-dev.yml
          environment-name: monet-env
          cache-environment: true
          # We force the python version from the matrix into the env
          create-args: python=${{ matrix.python-version }}

      - name: Install MONET in development mode
        run: pip install -e .

      - name: Run Tests
        run: pytest -v --cov=monet

  docs:
    name: Check docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Micromamba (Docs)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: docs/environment-docs.yml
          environment-name: monet-docs
          cache-environment: true

      - name: Sphinx Linkcheck
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck

      - name: Build Docs (Strict)
        run: sphinx-build -b html -W docs docs/_build/html
