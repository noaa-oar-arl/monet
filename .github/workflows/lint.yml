name: Linting

on:
  push:
    branches: [stable, master, develop, 'feature/**', 'refactor/**']
  pull_request:
    branches: [stable, master, develop, 'feature/**', 'refactor/**']

jobs:
  ruff:
    name: Lint and Format with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ruff
        run: pip install ruff

      - name: Check Formatting (Black style)
        run: ruff format --check .

      - name: Lint (Flake8/Isort style)
        # --fix can be added locally, but in CI we just want to check
        # --exit-zero can be added if you don't want it to fail the build yet
        run: ruff check .

  # Keep YAML linting to ensure workflow files are correct
  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint .github/workflows/*.yml
