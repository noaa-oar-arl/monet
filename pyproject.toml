[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monet"
version = "2.2.12"
description = "The Model and Observation Evaluation Toolkit (MONET)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Barry D. Baker", email = "barry.baker@noaa.gov"},
]
maintainers = [
  {name = "Barry D. Baker", email = "barry.baker@noaa.gov"},
]
license = {text = "MIT"}
keywords = ["model", "verification", "hysplit", "cmaq", "atmosphere", "camx", "evaluation", "ufs", "cesm", "acom", "wrf-chem"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "cartopy",
  "dask",
  "matplotlib",
  "monet-regrid @ git+https://github.com/noaa-oar-arl/monet-regrid",
  "monet-stats @ git+https://github.com/noaa-oar-arl/monet-stats",
  "netCDF4",
  "numpy",
  "pandas",
  "pydecorate",
  "seaborn",
  "xarray",
  "pooch",
  "stratify",
]

[tool.setuptools]
include-package-data = true
packages = ["monet", "monet.accessors", "monet.plots", "monet.util"]

[tool.setuptools.package-data]
"*" = ["data/*.png"]

[tool.black]
line-length = 100

[tool.isort]
known_first_party = "monet"
profile = "black"
line_length = 100

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:distutils Version classes:DeprecationWarning::",
    """ignore:elementwise comparison failed; returning scalar instead:\
       FutureWarning:xarray.core.dataarray:""",
]
