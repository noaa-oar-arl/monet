[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monet"
version = "2.3.1"
description = "The Model and Observation Evaluation Toolkit (MONET)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Barry D. Baker", email = "barry.baker@noaa.gov"},
]
maintainers = [
  {name = "Barry D. Baker", email = "barry.baker@noaa.gov"},
]
license = {text = "MIT"}
keywords = ["model", "verification", "hysplit", "cmaq", "atmosphere", "camx", "evaluation", "ufs", "cesm", "acom", "wrf-chem"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "cartopy",
  "matplotlib",
  "xregrid @ git+https://github.com/bbakernoaa/xregrid",
  "monet-stats @ git+https://github.com/noaa-oar-arl/monet-stats",
  "netCDF4",
  "numpy",
  "pandas",
  "seaborn",
  "xarray",
  "pooch",
  "requests",
  "Pillow>=9.1.0",
  "pytspack @ git+https://github.com/noaa-oar-arl/pytspack",
  "dask",
  "scipy",
]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gallery",
]
regions = [
    "geopandas",
    "rasterio",
    "shapely",
]
obs = [
    "monetio @ git+https://github.com/noaa-oar-arl/monetio",
]


[tool.setuptools]
include-package-data = true
packages = ["monet", "monet.accessors", "monet.plots", "monet.util"]

[tool.setuptools.package-data]
"*" = ["data/*.png", "util/data/masks/*.npz"]

[tool.black]
line-length = 132

[tool.isort]
known_first_party = "monet"
profile = "black"
line_length = 132

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:distutils Version classes:DeprecationWarning::",
    """ignore:elementwise comparison failed; returning scalar instead:\
       FutureWarning:xarray.core.dataarray:""",
]

[tool.ruff]
line-length = 132
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
