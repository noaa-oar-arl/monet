site_name: MONET
site_url: https://monet-arl.readthedocs.io
repo_url: https://github.com/noaa-oar-arl/monet
edit_uri: edit/develop/docs/

theme:
  name: material
  logo: _static/MONET-logo.png
  favicon: _static/MONET-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - _static/style.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_category_heading: true
  - gallery:
      examples_dirs: docs/examples
      gallery_dirs: docs/gallery

nav:
  - Home: index.md
  - Getting Started:
    - Why MONET?: why-monet.md
    - Installing: installing.md
    - MONET Xarray Accessor: monet-accessor.md
    - Visualization: visualization.md
    - Utility Tools: utility_tools.md
    - MONET on WCOSS: monet_wcoss.md
    - Tutorial: tutorial.md
    - Developer Guide: developer_guide.md
    - User Guide: user_guide.md
  - Gallery: gallery/index.md
  - API Reference: api.md
