name: monet-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.10
  - cartopy
  - dask
  - matplotlib
  - h5py
  - netcdf4
  - numpy
  - pandas
  - pillow>=9.1.0
  - pip
  - seaborn
  - xarray
  - pytest
  - pytest-cov
  - pooch
  - esmpy
  - scipy
  - pip:
      - monetio @ git+https://github.com/bbakernoaa/monetio@develop
      - xregrid @ git+https://github.com/bbakernoaa/xregrid
      - pytspack @ git+https://github.com/noaa-oar-arl/pytspack
      - monet-stats @ git+https://github.com/noaa-oar-arl/monet-stats
