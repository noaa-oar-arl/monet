name: monet-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.11
  - cartopy
  - dask
  - matplotlib
  - h5py
  - netcdf4
  - numpy
  - pandas
  - pillow>=9.1.0
  - pip
  - seaborn
  - xarray
  - pytest
  - pytest-cov
  - pooch
  # AXIS: C++20 compiler compatible with Kokkos, CMake >=3.21, MPI, Kokkos and KokkosKernels.
  - cmake>=3.21
  - kokkos>=5.1
  - kokkos-kernels>=5.1
  - openmpi
  - scipy
  - pip:
      - "axis-regrid @ git+https://github.com/NOAA-EMC/HELM.git@dda4cb5cb2b05f082c8637c4ad594fb74d8f8671#subdirectory=libs/axis"
      - "pytspack @ git+https://github.com/noaa-oar-arl/pytspack.git"
      - "monet-stats @ git+https://github.com/noaa-oar-arl/monet-stats.git"
